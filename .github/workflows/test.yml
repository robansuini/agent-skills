name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Agent contract lint
        run: node tests/lint/check-agent-contracts.js
      - name: Test suite
        run: node tests/run-all.js
